<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#202623"><title>Hero Workshop · Last Light Keep</title></head>
<body>
<header class="mast">
  <span class="brand">Last Light Keep</span>
  <span class="mast-line" aria-hidden="true"></span>
  <h1>Hero Workshop <small id="workshop-version"></small></h1>
  <button type="button" id="workshop-back" hidden>← Back to Almanac</button>
</header>
<main>
  <section class="selection" aria-label="Hero model selection">
    <label for="hero-select">Hero</label>
    <select id="hero-select">
      <option value="aldric">Aldric Vane</option>
      <option value="corwin">Corwin Ashguard</option>
    </select>
    <div class="model-versions" role="group" aria-labelledby="model-versions-label">
      <span id="model-versions-label">Model version</span>
      <button type="button" data-version="v1" aria-pressed="false">v1 · Original</button>
      <button type="button" data-version="v2" aria-pressed="true">v2 · Revised</button>
    </div>
  </section>
  <section class="bench" aria-label="Model and reference comparison">
    <div class="panels">
      <section class="panel live"><div class="panel-label"><i data-icon="cube"></i> Interactive model</div><div class="stage" id="stage" tabindex="0" aria-label="Interactive model. Drag or use arrow keys to rotate. Scroll or use plus and minus to zoom. Shift-drag to pan."></div><div class="panel-note"><i data-icon="rotate"></i> Drag to rotate <span class="mouse-hint">· Shift-drag to pan</span><span class="touch-hint">· Pinch to zoom</span></div><span id="status" role="status"></span></section>
      <section class="panel ref"><div class="panel-label"><i data-icon="sheet"></i> Reference art</div><div class="stage" id="reference-stage"><img id="reference" alt=""></div><div class="sheet-note" id="sheet-note">Front view</div></section>
    </div>
    <div class="toolbar">
      <div class="presets" role="group" aria-label="Camera presets"><button data-view="0" aria-pressed="true">Front</button><button data-view="1" aria-pressed="false" aria-label="Three-quarter">¾</button><button data-view="2" aria-pressed="false">Side</button><button data-view="3" aria-pressed="false">Back</button></div>
      <div class="tools"><button id="spin" aria-pressed="false"><i data-icon="spin"></i> Spin</button><span class="divider"></span><div class="zoom"><button id="minus" aria-label="Zoom out"><i data-icon="minus"></i></button><output id="zoom-level">100%</output><button id="plus" aria-label="Zoom in"><i data-icon="plus"></i></button></div><button id="reset" aria-label="Reset camera">Reset</button></div>
    </div>
  </section>
  <section class="motion-bar" id="motion-bar" aria-labelledby="motion-heading" hidden>
    <h2 id="motion-heading">Animations</h2>
    <div id="motion" role="group" aria-label="Actions"></div>
    <div class="frame-controls" role="group" aria-label="Frame inspection">
      <button id="play-motion" type="button">Pause</button><button id="replay-motion" type="button">Replay</button>
      <button id="previous-frame" type="button" aria-label="Previous frame">−1 frame</button>
      <input id="motion-frame" type="range" aria-label="Animation frame" min="0" max="0" value="0">
      <button id="next-frame" type="button" aria-label="Next frame">+1 frame</button>
      <output id="frame-label" for="motion-frame">Frame —</output>
    </div>
  </section>
  <footer><span id="camera-label" aria-live="polite">Front camera</span><a id="asset" href="#" download hidden><i data-icon="download"></i> Download model <small>GLB</small></a></footer>
</main>
<script type="module" src="./standalone.js"></script>
</body></html>
